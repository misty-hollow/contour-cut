name: CI

# PR과 main push에서만 돈다(AI-Dev-Workflow v1.2 WORKFLOW 8절 6). 경로 필터를 두지 않는다.
# 완료·병합 조건은 PR 최신 변경의 필수 체크 `ci`이고, main push 실행은 병합 후 검증이다.
# AI API를 부르지 않고, 외부로 아무것도 올리지 않는다(아티팩트 업로드 없음, CLAUDE.md E절).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # 실행 검증 ①: 프로덕션 빌드를 띄우고 실제 키보드·마우스 입력으로 대표 플레이 경로를 돈다
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Play-path e2e
        run: npm run e2e
